name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          for f in *.sh; do
            bash -n "$f"
          done

      - name: Verify README blog link uses pretty permalink
        run: ./script/check-blog-link.sh
